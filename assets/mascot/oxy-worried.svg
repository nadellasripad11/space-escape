<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="oxy the mascot (worried)"><style>.mascot-bob{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 190px}.eyes{transform-origin:100px 104px;animation:blink 4.6s infinite}.orb{animation:orb 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}@keyframes orb{50%{opacity:.55}}</style><defs>
